<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>
    // Applied before first paint so a chosen theme never flashes the other one.
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v=7">
  <title>{% block title %}Recipe Book{% endblock %}</title>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="bar">
    <div class="bar-inner">
      <div class="bar-left">{% block bar_left %}{% endblock %}</div>
      <div class="bar-title">{% block bar_title %}{% endblock %}</div>
      <div class="bar-right">{% block bar_right %}{% endblock %}</div>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v=6" defer></script>
</body>
</html>
