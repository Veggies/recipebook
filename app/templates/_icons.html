{# Line icons in the SF Symbols spirit (paths from Lucide, ISC licence). #}
{% macro icon(name, size=24) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "book" -%}
<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
{%- elif name == "cart" -%}
<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
{%- elif name == "plus" -%}
<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>
{%- elif name == "back" -%}
<path d="m15 18-6-6 6-6"/>
{%- elif name == "compose" -%}
<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>
{%- endif -%}
</svg>
{%- endmacro %}

{# Round glass back button, as in iOS 26 navigation bars. #}
{% macro back(href, label) -%}
<a class="glass-btn round back" href="{{ href }}" aria-label="Back to {{ label }}" data-nav="back">{{ icon("back", 22) }}</a>
{%- endmacro %}
