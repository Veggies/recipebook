# Paste into TrueNAS: Apps > Discover Apps > ⋮ > Install via YAML.
# Set the dataset path. Sign-in is done by Cloudflare Access in front of it.
services:
  recipebook:
    image: ghcr.io/veggies/recipebook:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8420:8000"
    volumes:
      - /mnt/tank/apps/recipebook:/data
